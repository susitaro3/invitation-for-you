<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- 赤ワイン・アンティークレッドワックス グラデーション -->
    <radialGradient id="waxGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#b8263b"/>
      <stop offset="40%" stop-color="#8b1225"/>
      <stop offset="75%" stop-color="#5c0613"/>
      <stop offset="100%" stop-color="#3a020a"/>
    </radialGradient>

    <!-- 刻印（金箔押し風ゴールド）グラデーション -->
    <linearGradient id="stampGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- 立体凹凸エンボスシェード -->
    <radialGradient id="debossShade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </radialGradient>

    <!-- 立体シャドウ -->
    <filter id="waxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#2a0005" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 溶けたワックスの波打つ自然な外形 (Organic Melted Wax Edge) -->
  <path filter="url(#waxShadow)" fill="url(#waxGrad)" d="
    M 150 18
    C 180 14, 210 25, 235 42
    C 260 58, 280 82, 285 112
    C 292 142, 278 175, 272 205
    C 265 235, 252 262, 226 278
    C 200 295, 168 288, 138 290
    C 108 292, 75 282, 52 262
    C 28 242, 12 212, 14 180
    C 15 148, 32 118, 52 92
    C 72 65, 100 42, 130 25
    Z" />

  <!-- ワックス表面の光沢ハイライト -->
  <path fill="#ffffff" opacity="0.15" d="
    M 110 35
    C 140 28, 180 32, 215 50
    C 245 68, 265 98, 268 130
    C 240 100, 200 65, 110 35
    Z" />

  <!-- スタンプの押し込み円（中央凹み部） -->
  <circle cx="150" cy="150" r="96" fill="url(#debossShade)"/>
  <circle cx="150" cy="150" r="92" fill="none" stroke="#5c0613" stroke-width="4" opacity="0.8"/>
  <circle cx="150" cy="150" r="88" fill="none" stroke="url(#stampGold)" stroke-width="2"/>

  <!-- 刻印デザイン (洗練されたクラシカル・ダイヤモンド輝きモチーフ) -->
  <g transform="translate(150, 150)">
    <!-- 円周上のオリーブ / 月桂樹の彫り込み -->
    <path fill="url(#stampGold)" opacity="0.9" d="
      M -68 10 C -72 -20, -50 -55, -20 -68 C -25 -52, -22 -35, -30 -20 Z
      M 68 10 C 72 -20, 50 -55, 20 -68 C 25 -52, 22 -35, 30 -20 Z" />

    <!-- ダイヤモンドモチーフ (立体カット) -->
    <g filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))">
      <!-- ダイヤ外枠ファセット -->
      <polygon points="0,-32 26,-10 0,36 -26,-10" fill="url(#stampGold)" stroke="#5c0613" stroke-width="1.5"/>
      <!-- ダイヤ天面ファセット -->
      <polygon points="0,-32 12,-10 0,10 -12,-10" fill="#fef3c7" opacity="0.7"/>
      <!-- ダイヤ下部ファセットカット線 -->
      <polygon points="0,10 26,-10 0,36" fill="#d97706" opacity="0.5"/>
      <polygon points="0,10 -26,-10 0,36" fill="#92400e" opacity="0.5"/>
    </g>

    <!-- ダイヤの輝き線 (キラキラ) -->
    <path d="M 0 -44 L 0 -36 M -36 -10 L -28 -10 M 36 -10 L 28 -10 M -22 -32 L -16 -26 M 22 -32 L 16 -26" stroke="url(#stampGold)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 刻印テキスト: WEDDING -->
    <path id="textArc" fill="none" d="M -60 -45 A 72 72 0 0 1 60 -45" />
    <text fill="url(#stampGold)" font-family="'Shippori Mincho', 'Georgia', serif" font-size="14" font-weight="bold" letter-spacing="3" text-anchor="middle">
      <textPath href="#textArc" startOffset="50%">WEDDING</textPath>
    </text>

    <!-- 下部の星/光マーク -->
    <path d="M 0 56 L 3 46 L 12 46 L 5 40 L 8 31 L 0 36 L -8 31 L -5 40 L -12 46 L -3 46 Z" fill="url(#stampGold)"/>
  </g>
</svg>
