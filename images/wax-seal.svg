<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- 封筒に溶け込む優しいローズシャンパン・ゴールドワックス グラデーション -->
    <radialGradient id="waxGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#f7ebe2"/>
      <stop offset="35%" stop-color="#e2c8b8"/>
      <stop offset="70%" stop-color="#caab97"/>
      <stop offset="100%" stop-color="#a0806c"/>
    </radialGradient>

    <!-- ワックスの溢れ出た立体的厚み（縁の肉厚感）グラデーション -->
    <radialGradient id="edgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="95%" stop-color="#fcefe6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8a6752" stop-opacity="0.35"/>
    </radialGradient>

    <!-- 刻印（エレガントシャンパンゴールド）グラデーション -->
    <linearGradient id="stampGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f3e5ab"/>
      <stop offset="70%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#8a6d3b"/>
    </linearGradient>

    <!-- 優しい凹凸エンボスシェード -->
    <radialGradient id="debossShade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6e503c" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#6e503c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </radialGradient>

    <!-- 柔らかいドロップシャドウ -->
    <filter id="waxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="4" stdDeviation="4.5" flood-color="#7a5f4c" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 溶けたワックスの波打つ自然で肉厚な輪郭 (Realistic Organic Melted Wax Silhouette) -->
  <path filter="url(#waxShadow)" fill="url(#waxGrad)" d="
    M 152 12
    C 178 10, 198 22, 222 28
    C 245 35, 272 48, 282 72
    C 292 95, 280 120, 288 145
    C 295 170, 286 198, 276 220
    C 265 242, 252 268, 230 280
    C 208 292, 180 282, 155 288
    C 130 294, 102 290, 80 278
    C 58 265, 38 248, 25 225
    C 12 202, 15 175, 12 150
    C 10 125, 22 100, 38 78
    C 55 55, 78 32, 105 22
    C 125 15, 138 13, 152 12
    Z" />

  <!-- 外縁のワックス盛り上がり（立体的な肉厚感ハイライト） -->
  <path fill="url(#edgeGlow)" d="
    M 152 12
    C 178 10, 198 22, 222 28
    C 245 35, 272 48, 282 72
    C 292 95, 280 120, 288 145
    C 295 170, 286 198, 276 220
    C 265 242, 252 268, 230 280
    C 208 292, 180 282, 155 288
    C 130 294, 102 290, 80 278
    C 58 265, 38 248, 25 225
    C 12 202, 15 175, 12 150
    C 10 125, 22 100, 38 78
    C 55 55, 78 32, 105 22
    C 125 15, 138 13, 152 12
    Z" />

  <!-- ワックス表面の柔らかい光沢反射ハイライト -->
  <path fill="#ffffff" opacity="0.4" d="
    M 105 22
    C 135 15, 175 18, 210 32
    C 240 45, 268 75, 275 110
    C 240 75, 190 42, 105 22
    Z" />

  <!-- スタンプの押し込み円（中央凹み部） -->
  <circle cx="150" cy="150" r="96" fill="url(#debossShade)"/>
  <circle cx="150" cy="150" r="92" fill="none" stroke="#a0806c" stroke-width="3" opacity="0.6"/>
  <circle cx="150" cy="150" r="88" fill="none" stroke="url(#stampGold)" stroke-width="2"/>

  <!-- 刻印デザイン (洗練されたクラシカル・ダイヤモンド輝きモチーフ) -->
  <g transform="translate(150, 150)">
    <!-- 円周上のオリーブ / 月桂樹の彫り込み -->
    <path fill="url(#stampGold)" opacity="0.9" d="
      M -68 10 C -72 -20, -50 -55, -20 -68 C -25 -52, -22 -35, -30 -20 Z
      M 68 10 C 72 -20, 50 -55, 20 -68 C 25 -52, 22 -35, 30 -20 Z" />

    <!-- ダイヤモンドモチーフ (立体カット) -->
    <g filter="drop-shadow(0 1px 3px rgba(110,80,60,0.3))">
      <!-- ダイヤ外枠ファセット -->
      <polygon points="0,-32 26,-10 0,36 -26,-10" fill="url(#stampGold)" stroke="#8a6d3b" stroke-width="1.2"/>
      <!-- ダイヤ天面ファセット -->
      <polygon points="0,-32 12,-10 0,10 -12,-10" fill="#ffffff" opacity="0.8"/>
      <!-- ダイヤ下部ファセットカット線 -->
      <polygon points="0,10 26,-10 0,36" fill="#c5a059" opacity="0.5"/>
      <polygon points="0,10 -26,-10 0,36" fill="#8a6d3b" opacity="0.5"/>
    </g>

    <!-- ダイヤの輝き線 (キラキラ) -->
    <path d="M 0 -44 L 0 -36 M -36 -10 L -28 -10 M 36 -10 L 28 -10 M -22 -32 L -16 -26 M 22 -32 L 16 -26" stroke="url(#stampGold)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 刻印テキスト: WEDDING -->
    <path id="textArc" fill="none" d="M -60 -45 A 72 72 0 0 1 60 -45" />
    <text fill="url(#stampGold)" font-family="'Shippori Mincho', 'Georgia', serif" font-size="14" font-weight="bold" letter-spacing="3" text-anchor="middle">
      <textPath href="#textArc" startOffset="50%">WEDDING</textPath>
    </text>

    <!-- 下部の星/光マーク -->
    <path d="M 0 56 L 3 46 L 12 46 L 5 40 L 8 31 L 0 36 L -8 31 L -5 40 L -12 46 L -3 46 Z" fill="url(#stampGold)"/>
  </g>
</svg>
